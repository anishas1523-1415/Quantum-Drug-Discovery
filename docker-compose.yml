services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qdd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qdd_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-quantum_drug_discovery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qdd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting}
      DATABASE_URL: postgresql://${POSTGRES_USER:-qdd}:${POSTGRES_PASSWORD:-qdd_local_dev_password}@postgres:5432/${POSTGRES_DB:-quantum_drug_discovery}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      FLASK_DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@quantum-drug-discovery.local}
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend-app
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
